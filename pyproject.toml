[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "order-report-project"
version = "0.1.0"
description = "Refaktorerat program för orderrapportering"
requires-python = ">=3.10"
dependencies = [
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]